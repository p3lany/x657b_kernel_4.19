name: X657B ARM64 kernel build

on:
  workflow_dispatch:
  push:
    branches:
      - arm64/x657b-defconfig
    paths:
      - 'arch/arm64/configs/x657b_arm64_defconfig'
      - '.github/workflows/x657b-arm64.yml'
      - 'arch/arm64/**'
      - 'drivers/**'
      - 'kernel/**'
      - 'Makefile'

concurrency:
  group: x657b-arm64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  arm64-config-and-image:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential clang-11 \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi flex libelf-dev libssl-dev python3 \
            dwarves device-tree-compiler

      - name: Generate X657B ARM64 configuration
        run: |
          set -o pipefail
          make O=out ARCH=arm64 CC='clang-11 --target=aarch64-linux-gnu' \
            LD=aarch64-linux-gnu-ld AR=aarch64-linux-gnu-ar \
            NM=aarch64-linux-gnu-nm OBJCOPY=aarch64-linux-gnu-objcopy \
            OBJDUMP=aarch64-linux-gnu-objdump READELF=aarch64-linux-gnu-readelf \
            STRIP=aarch64-linux-gnu-strip CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            x657b_arm64_defconfig 2>&1 | tee defconfig.log
          make O=out ARCH=arm64 CC='clang-11 --target=aarch64-linux-gnu' \
            LD=aarch64-linux-gnu-ld AR=aarch64-linux-gnu-ar \
            NM=aarch64-linux-gnu-nm OBJCOPY=aarch64-linux-gnu-objcopy \
            OBJDUMP=aarch64-linux-gnu-objdump READELF=aarch64-linux-gnu-readelf \
            STRIP=aarch64-linux-gnu-strip CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig 2>&1 | tee -a defconfig.log
          grep -E '^(CONFIG_ARM64|CONFIG_MACH_MT6761|CONFIG_COMPAT|CONFIG_NR_CPUS)=' out/.config
          grep -qx 'CONFIG_ARM64=y' out/.config
          grep -qx 'CONFIG_MACH_MT6761=y' out/.config
          grep -qx 'CONFIG_COMPAT=y' out/.config
          grep -qx 'CONFIG_NR_CPUS=4' out/.config
          grep -qx 'CONFIG_TOUCHSCREEN_MTK_NT36572_COMMON=y' out/.config
          grep -qx 'CONFIG_ANDROID=y' out/.config
          grep -qx 'CONFIG_ANDROID_BINDER_IPC=y' out/.config
          grep -qx 'CONFIG_ANDROID_BINDERFS=y' out/.config
          grep -qx 'CONFIG_ANDROID_BINDER_DEVICES="binder,hwbinder,vndbinder"' out/.config
          grep -qx 'CONFIG_ASHMEM=y' out/.config

      - name: Build ARM64 kernel Image and compressed image
        run: |
          set -o pipefail
          make -j2 O=out ARCH=arm64 CC='clang-11 --target=aarch64-linux-gnu' \
            LD=aarch64-linux-gnu-ld AR=aarch64-linux-gnu-ar \
            NM=aarch64-linux-gnu-nm OBJCOPY=aarch64-linux-gnu-objcopy \
            OBJDUMP=aarch64-linux-gnu-objdump READELF=aarch64-linux-gnu-readelf \
            STRIP=aarch64-linux-gnu-strip CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image 2>&1 | tee build.log
          make -j2 O=out ARCH=arm64 CC='clang-11 --target=aarch64-linux-gnu' \
            LD=aarch64-linux-gnu-ld AR=aarch64-linux-gnu-ar \
            NM=aarch64-linux-gnu-nm OBJCOPY=aarch64-linux-gnu-objcopy \
            OBJDUMP=aarch64-linux-gnu-objdump READELF=aarch64-linux-gnu-readelf \
            STRIP=aarch64-linux-gnu-strip CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            arch/arm64/boot/Image.gz 2>&1 | tee -a build.log

      - name: Verify output architecture and compression
        run: |
          set -e
          test -s out/arch/arm64/boot/Image
          test -s out/arch/arm64/boot/Image.gz
          file out/arch/arm64/boot/Image out/arch/arm64/boot/Image.gz
          python3 - <<'PY'
          from pathlib import Path
          import gzip, hashlib, struct
          image = Path("out/arch/arm64/boot/Image").read_bytes()
          packed = Path("out/arch/arm64/boot/Image.gz").read_bytes()
          if len(image) < 64 or image[0x38:0x3c] != b"ARM\x64":
              raise SystemExit("Output is not a valid AArch64 Linux Image: ARM64 magic missing at offset 0x38")
          if gzip.decompress(packed) != image:
              raise SystemExit("Image.gz does not decompress byte-for-byte to Image")
          print(f"Image: {len(image)} bytes; text_offset=0x{struct.unpack_from('<Q', image, 8)[0]:x}; image_size={struct.unpack_from('<Q', image, 16)[0]}")
          print(f"Image.gz: {len(packed)} bytes; exact decompression match")
          print("SHA256 Image:", hashlib.sha256(image).hexdigest())
          print("SHA256 Image.gz:", hashlib.sha256(packed).hexdigest())
          PY
          cp out/.config x657b-arm64.config

      - name: Upload config and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x657b-arm64-build-diagnostics
          path: |
            x657b-arm64.config
            defconfig.log
            build.log
          if-no-files-found: warn
          include-hidden-files: true

      - name: Upload ARM64 kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: x657b-arm64-kernel-images
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
          if-no-files-found: error
